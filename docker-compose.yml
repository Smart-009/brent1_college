version: '3.8'

services:
  volt-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volt-quant-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=change-this-in-production-volt-secret-key-32chars
      - ENVIRONMENT=production
    volumes:
      - volt-data:/app/db
      - volt-logs:/app/logs

volumes:
  volt-data:
  volt-logs:
