<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Éclat Institute - Social Media Video Ad Studio</title>
  <style>
    :root {
      --bg-dark: #070a12;
      --panel-bg: #0f172a;
      --card-bg: #1e293b;
      --gold: #d4af37;
      --gold-light: #fef08a;
      --gold-glow: rgba(212, 175, 55, 0.4);
      --navy: #090d16;
      --blue: #2563eb;
      --cyan: #38bdf8;
      --green: #22c55e;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #090d16;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding: 1rem 2rem;
      display: flex;
      justifyContent: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .brand-title span {
      font-size: 0.75rem;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 700;
    }
    .studio-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      flex-direction: row;
    }
    @media (max-width: 1024px) {
      .studio-container { flex-direction: column; overflow-y: auto; }
    }
    /* Controls Panel */
    .controls-panel {
      width: 440px;
      background: var(--panel-bg);
      border-right: 1px solid #1e293b;
      padding: 1.5rem;
      overflow-y: auto;
      max-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    @media (max-width: 1024px) {
      .controls-panel { width: 100%; max-height: none; }
    }
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold);
      font-weight: 800;
      margin-bottom: 0.65rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field-group {
      margin-bottom: 0.85rem;
    }
    label {
      display: block;
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }
    input, select, textarea {
      width: 100%;
      background: #090d16;
      border: 1px solid #334155;
      color: #ffffff;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
    }
    .btn-group-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }
    .preset-btn, .format-btn {
      background: var(--card-bg);
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 0.55rem 0.4rem;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .preset-btn.active, .format-btn.active {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold);
      color: var(--gold-light);
    }
    .btn-action {
      background: linear-gradient(135deg, #d4af37 0%, #b45309 100%);
      color: #0c0e12;
      border: none;
      padding: 0.9rem 1.25rem;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px var(--gold-glow);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
    }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid #475569;
      color: #ffffff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    /* Preview Stage */
    .preview-stage {
      flex: 1;
      background: #020617;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }
    .canvas-wrapper {
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      overflow: hidden;
      max-height: 78vh;
      max-width: 90%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .timeline-indicator {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .recording-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: #ef4444;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 800;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <img src="../logo-emblem-no-background.png" alt="Logo" style="width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--gold);" onerror="this.style.display='none'">
      <div>
        <h1>Éclat Institute</h1>
        <div style="font-size: 0.72rem; color: #94a3b8;">Automated Social Media Video Ad & Poster Studio</div>
      </div>
    </div>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <div id="recBadge" class="recording-badge">● RECORDING VIDEO AD...</div>
      <button type="button" class="btn-secondary" id="btnSnapshot">📸 Save HD Poster (.PNG)</button>
      <button type="button" class="btn-action" id="btnRecord">🎬 Record & Export Video (.WebM/MP4)</button>
    </div>
  </header>

  <div class="studio-container">
    <!-- Sidebar Controls -->
    <div class="controls-panel">
      <div>
        <div class="section-title">1. Select Aspect Ratio</div>
        <div class="btn-group-grid">
          <button type="button" class="format-btn active" data-aspect="9:16">9:16 Reel / Story<br><span style="font-size:0.68rem;opacity:0.8">(TikTok / IG)</span></button>
          <button type="button" class="format-btn" data-aspect="1:1">1:1 Square Post<br><span style="font-size:0.68rem;opacity:0.8">(Feed / Carousels)</span></button>
          <button type="button" class="format-btn" data-aspect="16:9">16:9 Landscape<br><span style="font-size:0.68rem;opacity:0.8">(YouTube / Web)</span></button>
        </div>
      </div>

      <div>
        <div class="section-title">2. Campaign Presets</div>
        <div style="display: flex; flex-direction: column; gap: 0.4rem;">
          <button type="button" class="preset-btn active" data-preset="igcse">Cambridge IGCSE & A-Levels (Centre KE042)</button>
          <button type="button" class="preset-btn" data-preset="coding">Tech & Full-Stack Coding (React 19 & Python)</button>
          <button type="button" class="preset-btn" data-preset="data">Data Science & Survey Research (SPSS & R)</button>
          <button type="button" class="preset-btn" data-preset="business">Top-Paying Business Certs (PMP®, FMVA®)</button>
          <button type="button" class="preset-btn" data-preset="ielts">IELTS Band 8.5+ & World Languages</button>
        </div>
      </div>

      <div>
        <div class="section-title">3. Ad Copy & Typography</div>
        <div class="field-group">
          <label>Department / Top Badge</label>
          <input type="text" id="inpBadge" value="CAMBRIDGE INTERNATIONAL EXAM CENTRE (KE042)">
        </div>
        <div class="field-group">
          <label>Main Headline</label>
          <input type="text" id="inpHeadline" value="Cambridge IGCSE & A-Levels">
        </div>
        <div class="field-group">
          <label>Highlight Tagline</label>
          <input type="text" id="inpHighlight" value="100% Online • Live Virtual Classrooms">
        </div>
        <div class="field-group">
          <label>Benefit 1</label>
          <input type="text" id="inpBullet1" value="Dual 9-1 & A*-G Official Grading Scale">
        </div>
        <div class="field-group">
          <label>Benefit 2</label>
          <input type="text" id="inpBullet2" value="Weekly Cambridge Past Paper Exam Practicals">
        </div>
        <div class="field-group">
          <label>Benefit 3</label>
          <input type="text" id="inpBullet3" value="6 Daily Flexible Shifts • Study Worldwide">
        </div>
        <div class="field-group">
          <label>Tuition / Offer Pill</label>
          <input type="text" id="inpOffer" value="50% Flexible Monthly Installments Available">
        </div>
        <div class="field-group">
          <label>Call to Action & Phone</label>
          <input type="text" id="inpCta" value="Apply Now: WhatsApp +254 742 813 060">
        </div>
      </div>

      <div>
        <div class="section-title">4. Video Settings</div>
        <div class="field-group">
          <label>Video Duration (Seconds)</label>
          <select id="selDuration">
            <option value="8">8 Seconds (Quick Reel / Story Hook)</option>
            <option value="12" selected>12 Seconds (Recommended for Social Ads)</option>
            <option value="15">15 Seconds (Full Feature Showcase)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Preview Stage -->
    <div class="preview-stage">
      <div class="canvas-wrapper" id="wrapper">
        <canvas id="adCanvas" width="1080" height="1920"></canvas>
      </div>

      <div class="timeline-indicator">
        <span id="timeText">00:00 / 00:12</span>
        <button type="button" id="btnPlayPause" class="btn-secondary" style="padding: 4px 10px; font-size: 0.76rem;">⏸ Pause</button>
        <button type="button" id="btnReset" class="btn-secondary" style="padding: 4px 10px; font-size: 0.76rem;">↺ Restart</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('adCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('wrapper');
    const timeText = document.getElementById('timeText');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnReset = document.getElementById('btnReset');
    const btnRecord = document.getElementById('btnRecord');
    const btnSnapshot = document.getElementById('btnSnapshot');
    const recBadge = document.getElementById('recBadge');

    let isPlaying = true;
    let isRecording = false;
    let animFrameId = null;
    let startTime = performance.now();
    let pausedAt = 0;
    let currentAspect = '9:16';
    let durationSeconds = 12;

    // Presets
    const PRESETS = {
      igcse: {
        badge: 'CAMBRIDGE INTERNATIONAL EXAM CENTRE (KE042)',
        headline: 'Cambridge IGCSE & A-Levels',
        highlight: '100% Online • Live Virtual Classrooms',
        b1: 'Dual 9-1 & A*-G Official Grading Scale',
        b2: 'Weekly Cambridge Past Paper Exam Practicals',
        b3: '6 Daily Flexible Shifts • Study Worldwide',
        offer: '50% Flexible Monthly Installments Available',
        cta: 'Apply Now: WhatsApp +254 742 813 060',
        accent: '#38bdf8'
      },
      coding: {
        badge: 'TECH & SOFTWARE ENGINEERING FACULTY',
        headline: 'React 19, Python & Cybersecurity',
        highlight: 'Industry Mentor Reviews & Live Labs',
        b1: 'Build Enterprise Web & Cloud Architectures',
        b2: 'Live Breakout Rooms & GitHub Code Reviews',
        b3: 'Direct Fast-Track High Salary Remote Jobs',
        offer: 'Verified E-Certificates & Portfolio Reviews',
        cta: 'Enroll Today: WhatsApp +254 742 813 060',
        accent: '#818cf8'
      },
      data: {
        badge: 'SCHOOL OF IT & DATA SCIENCE RESEARCH',
        headline: 'RStudio, SPSS & Python Analytics',
        highlight: 'Multivariate Econometrics & Biostatistics',
        b1: 'Survey Cleaning, Regressions & Stata Modeling',
        b2: 'Taught by Senior Research Methodologists',
        b3: 'Automate International Industry Data Pipelines',
        offer: 'Certified Data Analyst Credential',
        cta: 'Inquire Now: WhatsApp +254 742 813 060',
        accent: '#34d399'
      },
      business: {
        badge: 'SCHOOL OF BUSINESS & MANAGEMENT',
        headline: 'Top-Paying Business Credentials',
        highlight: 'PMP®, FMVA®, Six Sigma & CBAP® Tracks',
        b1: 'Average Global Certified Earnings $130K+',
        b2: 'Wall Street Financial Modeling & Scrum Sprints',
        b3: 'Executive Boardroom Case Studies & Capstones',
        offer: 'Fast-Track 2-Installment Tuition Option',
        cta: 'Secure Admission: WhatsApp +254 742 813 060',
        accent: '#fbbf24'
      },
      ielts: {
        badge: 'SCHOOL OF WORLD LANGUAGES & RELOCATION',
        headline: 'Score IELTS Band 8.5+ & Fluency',
        highlight: 'German Goethe, Arabic, French & English',
        b1: '1-on-1 Zoom Mock Speaking with Certified Examiners',
        b2: 'Cambridge Essay Reviews & Instant Grading',
        b3: 'Secure UK, Canada, USA & European Visas',
        offer: 'High First-Attempt Pass Guarantee',
        cta: 'Join Next Intake: WhatsApp +254 742 813 060',
        accent: '#f43f5e'
      }
    };

    let activeAccent = '#38bdf8';

    // Particle Background System
    const particles = [];
    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * 1080,
        y: Math.random() * 1920,
        r: Math.random() * 3 + 1,
        speed: Math.random() * 0.8 + 0.3,
        alpha: Math.random() * 0.5 + 0.2
      });
    }

    // Logo image
    const logoImg = new Image();
    logoImg.src = '../logo-emblem-no-background.png';

    function setCanvasDimensions(aspect) {
      if (aspect === '9:16') {
        canvas.width = 1080;
        canvas.height = 1920;
        wrapper.style.aspectRatio = '9/16';
      } else if (aspect === '1:1') {
        canvas.width = 1080;
        canvas.height = 1080;
        wrapper.style.aspectRatio = '1/1';
      } else if (aspect === '16:9') {
        canvas.width = 1920;
        canvas.height = 1080;
        wrapper.style.aspectRatio = '16/9';
      }
    }

    function drawScene(t) {
      const W = canvas.width;
      const H = canvas.height;

      // 1. Deep Academic Gradient Background
      const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.35, 50, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
      bgGrad.addColorStop(0, '#0f172a');
      bgGrad.addColorStop(0.5, '#090d16');
      bgGrad.addColorStop(1, '#030509');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // 2. Animated Floating Gold Dust Particles
      ctx.save();
      for (let p of particles) {
        p.y -= p.speed;
        if (p.y < 0) p.y = H;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(212, 175, 55, ' + (p.alpha * (0.6 + 0.4 * Math.sin(t * 2 + p.x))) + ')';
        ctx.shadowColor = 'rgba(212, 175, 55, 0.6)';
        ctx.shadowBlur = 8;
        ctx.fill();
      }
      ctx.restore();

      // 3. Luxurious Outer Framing Lines
      ctx.save();
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.25)';
      ctx.lineWidth = 2;
      ctx.strokeRect(36, 36, W - 72, H - 72);

      // Corner Accents
      const cSize = 24;
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 4;
      // Top-Left
      ctx.beginPath(); ctx.moveTo(36, 36 + cSize); ctx.lineTo(36, 36); ctx.lineTo(36 + cSize, 36); ctx.stroke();
      // Top-Right
      ctx.beginPath(); ctx.moveTo(W - 36 - cSize, 36); ctx.lineTo(W - 36, 36); ctx.lineTo(W - 36, 36 + cSize); ctx.stroke();
      // Bottom-Left
      ctx.beginPath(); ctx.moveTo(36, H - 36 - cSize); ctx.lineTo(36, H - 36); ctx.lineTo(36 + cSize, H - 36); ctx.stroke();
      // Bottom-Right
      ctx.beginPath(); ctx.moveTo(W - 36 - cSize, H - 36); ctx.lineTo(W - 36, H - 36); ctx.lineTo(W - 36, H - 36 - cSize); ctx.stroke();
      ctx.restore();

      // Determine Layout Vertical Offsets based on aspect ratio
      const isVertical = (currentAspect === '9:16');
      let centerY = isVertical ? H * 0.14 : H * 0.12;

      // 4. Institution Logo / Emblem
      ctx.save();
      const logoSize = isVertical ? 120 : 90;
      if (logoImg.complete && logoImg.naturalWidth > 0) {
        ctx.drawImage(logoImg, (W - logoSize) / 2, centerY - logoSize / 2, logoSize, logoSize);
      } else {
        ctx.beginPath();
        ctx.arc(W / 2, centerY, logoSize / 2, 0, Math.PI * 2);
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 4;
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#d4af37';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('É', W / 2, centerY);
      }
      ctx.restore();

      centerY += isVertical ? 105 : 75;

      // 5. Institution Name
      ctx.save();
      ctx.font = '900 38px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#d4af37';
      ctx.shadowColor = 'rgba(212, 175, 55, 0.4)';
      ctx.shadowBlur = 12;
      ctx.fillText('ÉCLAT INSTITUTE', W / 2, centerY);
      ctx.restore();

      centerY += 42;

      // 6. Sub-Brand / Badge
      const badgeText = document.getElementById('inpBadge').value.trim();
      if (badgeText) {
        ctx.save();
        ctx.font = 'bold 22px sans-serif';
        const badgeWidth = ctx.measureText(badgeText).width + 36;
        ctx.fillStyle = 'rgba(56, 189, 248, 0.12)';
        ctx.strokeStyle = activeAccent;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(W / 2 - badgeWidth / 2, centerY - 18, badgeWidth, 36, 18);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = activeAccent;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(badgeText, W / 2, centerY);
        ctx.restore();
      }

      centerY += isVertical ? 110 : 70;

      // 7. Kinetic Headline with Slide & Glow
      const headline = document.getElementById('inpHeadline').value;
      const highlight = document.getElementById('inpHighlight').value;
      
      const wave = Math.sin(t * 1.5) * 4;

      ctx.save();
      ctx.font = isVertical ? '900 68px sans-serif' : '900 52px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 16;
      ctx.fillText(headline, W / 2, centerY + wave);

      centerY += isVertical ? 75 : 55;
      ctx.font = isVertical ? '800 42px sans-serif' : '800 34px sans-serif';
      ctx.fillStyle = '#fef08a';
      ctx.fillText(highlight, W / 2, centerY + wave);
      ctx.restore();

      centerY += isVertical ? 110 : 75;

      // 8. Key Value Proposition Cards / Bullets
      const b1 = document.getElementById('inpBullet1').value;
      const b2 = document.getElementById('inpBullet2').value;
      const b3 = document.getElementById('inpBullet3').value;
      const bullets = [b1, b2, b3].filter(Boolean);

      const cardW = isVertical ? W * 0.86 : Math.min(W * 0.7, 900);
      const cardH = isVertical ? 68 : 52;
      const cardGap = isVertical ? 22 : 16;

      ctx.save();
      bullets.forEach((bullet, idx) => {
        const by = centerY + idx * (cardH + cardGap);
        ctx.fillStyle = 'rgba(30, 41, 59, 0.65)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(W / 2 - cardW / 2, by, cardW, cardH, 12);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#f8fafc';
        ctx.font = isVertical ? 'bold 30px sans-serif' : 'bold 24px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('•  ' + bullet, W / 2 - cardW / 2 + 28, by + cardH / 2);
      });
      ctx.restore();

      centerY += bullets.length * (cardH + cardGap) + (isVertical ? 50 : 30);

      // 9. Tuition Offer Glow Pill
      const offer = document.getElementById('inpOffer').value;
      if (offer) {
        ctx.save();
        ctx.font = isVertical ? '900 30px sans-serif' : '900 24px sans-serif';
        const oWidth = ctx.measureText(offer).width + 48;
        
        ctx.shadowColor = 'rgba(212, 175, 55, 0.6)';
        ctx.shadowBlur = 16 + Math.sin(t * 4) * 6;
        ctx.fillStyle = 'rgba(212, 175, 55, 0.15)';
        ctx.strokeStyle = '#d4af37';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(W / 2 - oWidth / 2, centerY, oWidth, 58, 29);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(offer, W / 2, centerY + 29);
        ctx.restore();
      }

      // 10. Bottom Action Banner & WhatsApp Hotline
      const cta = document.getElementById('inpCta').value;
      const btmY = isVertical ? H - 180 : H - 140;

      ctx.save();
      const btnW = isVertical ? W * 0.84 : 700;
      const btnH = isVertical ? 86 : 70;
      
      const btnGrad = ctx.createLinearGradient(W / 2 - btnW / 2, btmY, W / 2 + btnW / 2, btmY + btnH);
      btnGrad.addColorStop(0, '#22c55e');
      btnGrad.addColorStop(1, '#16a34a');
      ctx.fillStyle = btnGrad;
      ctx.shadowColor = 'rgba(34, 197, 94, 0.5)';
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.roundRect(W / 2 - btnW / 2, btmY, btnW, btnH, 18);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = isVertical ? '900 34px sans-serif' : '900 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = 0;
      ctx.fillText(cta, W / 2, btmY + btnH / 2);

      // Website URL under button
      ctx.font = 'bold 22px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('www.eclatinstitute.co.ke • Nairobi, Kenya & Worldwide Virtual Campus', W / 2, btmY + btnH + 34);
      ctx.restore();
    }

    function loop(now) {
      if (!startTime) startTime = now;
      const elapsed = (now - startTime) / 1000;
      const curTime = (elapsed % durationSeconds);

      // Update timer UI
      const mm = String(Math.floor(curTime / 60)).padStart(2, '0');
      const ss = String(Math.floor(curTime % 60)).padStart(2, '0');
      const dmm = String(Math.floor(durationSeconds / 60)).padStart(2, '0');
      const dss = String(Math.floor(durationSeconds % 60)).padStart(2, '0');
      timeText.textContent = mm + ':' + ss + ' / ' + dmm + ':' + dss;

      drawScene(curTime);

      if (isPlaying) {
        animFrameId = requestAnimationFrame(loop);
      }
    }

    animFrameId = requestAnimationFrame(loop);

    // Controls Logic
    btnPlayPause.addEventListener('click', () => {
      if (isPlaying) {
        isPlaying = false;
        cancelAnimationFrame(animFrameId);
        btnPlayPause.textContent = '▶ Play';
      } else {
        isPlaying = true;
        startTime = performance.now() - (pausedAt * 1000);
        animFrameId = requestAnimationFrame(loop);
        btnPlayPause.textContent = '⏸ Pause';
      }
    });

    btnReset.addEventListener('click', () => {
      startTime = performance.now();
    });

    document.querySelectorAll('.format-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentAspect = btn.dataset.aspect;
        setCanvasDimensions(currentAspect);
      });
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const p = PRESETS[btn.dataset.preset];
        if (p) {
          document.getElementById('inpBadge').value = p.badge;
          document.getElementById('inpHeadline').value = p.headline;
          document.getElementById('inpHighlight').value = p.highlight;
          document.getElementById('inpBullet1').value = p.b1;
          document.getElementById('inpBullet2').value = p.b2;
          document.getElementById('inpBullet3').value = p.b3;
          document.getElementById('inpOffer').value = p.offer;
          document.getElementById('inpCta').value = p.cta;
          activeAccent = p.accent;
        }
      });
    });

    document.getElementById('selDuration').addEventListener('change', (e) => {
      durationSeconds = parseInt(e.target.value, 10);
    });

    // 1. Snapshot Poster Export
    btnSnapshot.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'eclat-ad-poster-' + currentAspect.replace(':', 'x') + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // 2. High-Quality Video Recording (MediaRecorder API)
    btnRecord.addEventListener('click', async () => {
      if (isRecording) return;
      isRecording = true;
      recBadge.style.display = 'inline-flex';
      btnRecord.disabled = true;
      btnRecord.textContent = 'Recording in progress...';

      // Reset timer to beginning
      startTime = performance.now();
      
      const stream = canvas.captureStream(60); // 60 FPS recording
      let options = { mimeType: 'video/webm;codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
      }

      const recorder = new MediaRecorder(stream, options);
      const chunks = [];

      recorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'eclat-video-ad-' + currentAspect.replace(':', 'x') + '-' + durationSeconds + 's.webm';
        a.click();

        recBadge.style.display = 'none';
        btnRecord.disabled = false;
        btnRecord.textContent = '🎬 Record & Export Video (.WebM/MP4)';
        isRecording = false;
      };

      recorder.start();

      // Automatically stop when the advert duration completes
      setTimeout(() => {
        if (recorder.state === 'recording') {
          recorder.stop();
        }
      }, durationSeconds * 1000);
    });
  </script>
</body>
</html>
