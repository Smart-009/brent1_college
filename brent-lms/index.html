            <h2>About Éclat Institute</h2>
            <p>
              Éclat Institute is a premier 100% online virtual campus serving local and international students across Africa, North America, Europe, the Middle East, and Asia. Our mission is to deliver high-standard, flexible, and career-oriented virtual education in modern Technology, Data Science, Cybersecurity, Software Engineering, and International Foreign Languages.
            </p>

          <section>
            <h2>Our 4 Academic Faculties & Online Programs</h2>
            <ul>
              <li><strong>IGCSE — British International Curriculum (Cambridge Center KE042 & Pearson Edexcel Center EDX-98421):</strong> Comprehensive secondary education across Years 9, 10, and 11. Subjects include Mathematics (0580 / 4MA1), Physics (0625 / 4PH1), Chemistry (0620 / 4CH1), Biology (0610 / 4BI1), Computer Science (0478 / 4CP0), English (0500 / 4EA1), Business Studies (0450 / 4BS1), and Economics (0455 / 4EC1) with 9-1 / A*-G grading.</li>
              <li><strong>School of IT and Data Science:</strong> Full-Stack Web Development (React 19, TypeScript, Node.js), Python Data Science & Machine Learning, Statistical Computing (R, SPSS, Stata), UI/UX Product Design (Figma), and Enterprise Cybersecurity.</li>
              <li><strong>School of Business:</strong> Business Technology, Computerized Accounting (QuickBooks Pro & Tally ERP), Financial Modeling, Corporate Bookkeeping, and International VAT & Tax Management.</li>
              <li><strong>School of Language:</strong> IELTS Academic & General Training Exam Coaching (Band 7.5 to 9.0), German (Goethe A1-B2), French (DELF A1-B2), Modern Standard Arabic, and Swahili for Global Careers.</li>
            </ul>
          </section>

          <section>
            <h2>Key Institutional Features</h2>
            <ul>
              <li><strong>100% Online Virtual Classrooms:</strong> Live Google Meet & Zoom interactive sessions with dedicated shift timetables (Morning, Afternoon, Evening, and Night batches).</li>
              <li><strong>24/7 Cloud Learning Management System (LMS):</strong> Full access to on-demand video lectures, interactive code labs, and downloadable syllabus study notes.</li>
              <li><strong>Verified Digital E-Certificates & Modular Diplomas:</strong> Instant online verification with unique QR codes and serial certificate numbers recognized by employers globally.</li>
              <li><strong>Flexible Tuition & Installments in USD:</strong> Affordable tuition with convenient installment plans and transparent billing for international students.</li>
            </ul>
          </section>
