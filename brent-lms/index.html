    <!-- Prevent flash of wrong theme & force SW updates -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('eclat-theme') || localStorage.getItem('bc-theme');
          if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch(e) {}

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) {
              r.update();
            }
          });
        }
      })();
    </script>
