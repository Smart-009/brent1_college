          <section>
            <h2>About Éclat Institute</h2>
            <p>
              Éclat Institute is an accredited 100% online global academy serving local and international students across Africa, North America, Europe, the Middle East, and Asia. Our mission is to deliver high-standard, flexible, and career-oriented virtual education in modern Technology, Data Science, Cybersecurity, Software Engineering, and International Foreign Languages.
            </p>
          </section>

          <section>
            <h2>Our Global Online Programs & Courses</h2>
            <ul>
              <li><strong>Full-Stack Web Development & Modern JavaScript (React 19 & Node.js):</strong> 12-week comprehensive coding program with live interactive labs, PostgreSQL relational databases, API design, and portfolio cloud deployment.</li>
              <li><strong>Python Programming, SQL & Data Analytics:</strong> 8-week bootcamp covering Python OOP, Pandas data wrangling, NumPy numerical computing, SQL queries, and Power BI business intelligence dashboards.</li>
              <li><strong>Cybersecurity & Ethical Hacking:</strong> Hands-on defense and network security protocols, vulnerability analysis, encryption fundamentals, and penetration testing labs.</li>
              <li><strong>Comprehensive Computer Packages & Digital Literacy:</strong> Microsoft Office Suite (Word, Advanced Excel, PowerPoint), Google Workspace, Canva Pro graphics, cloud collaboration, and speed typing.</li>
              <li><strong>IELTS Academic & General Training Exam Coaching:</strong> Targeted Band 7.5 to 9.0 preparation with 1-on-1 virtual speaking mock tests, reading comprehension strategies, listening drills, and essay grading.</li>
              <li><strong>International Foreign Languages (French, German Goethe Prep, Arabic, Kiswahili):</strong> Live interactive virtual cohorts taught by native-level faculty for global career advancement, multinational corporate employment, study abroad, and international relocation.</li>
              <li><strong>Business Tech & Accounting (QuickBooks & Tax Management):</strong> Practical automated corporate bookkeeping, invoicing, payroll systems, and tax compliance software.</li>
            </ul>
          </section>

          <section>
            <h2>Key Institutional Features</h2>
            <ul>
              <li><strong>100% Online Virtual Classrooms:</strong> Live Google Meet & Zoom interactive sessions with dedicated shift timetables (Morning, Afternoon, Evening, and Night batches).</li>
              <li><strong>24/7 Cloud Learning Management System (LMS):</strong> Full access to on-demand video lectures, interactive code labs, and downloadable syllabus study notes.</li>
              <li><strong>Verified Digital E-Certificates & Modular Diplomas:</strong> Instant online verification with unique QR codes and serial certificate numbers recognized by employers globally.</li>
              <li><strong>Flexible Tuition & Installments in USD:</strong> Affordable tuition with convenient installment plans and transparent billing for international students.</li>
            </ul>
          </section>
